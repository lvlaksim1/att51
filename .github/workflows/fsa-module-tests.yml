name: ATT51 FSA module checks
on:
  push:
    paths:
      - "fsa_xml_module/**"
      - "extracted/app/fileProtocolLoad_v4.xsd"
      - ".github/workflows/fsa-module-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development-only schema validator
        run: python -m pip install lxml
      - name: Compile all module sources
        run: python -m compileall -q fsa_xml_module/att51_fsa
      - name: Unit tests against original XSD
        env:
          PYTHONPATH: fsa_xml_module
        run: python -m unittest discover -s fsa_xml_module/tests -v
